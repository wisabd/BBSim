<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BB Code Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --surface3: #1e1e28;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.14);
    --accent: #7c6df0;
    --accent-dim: rgba(124,109,240,0.15);
    --accent-glow: rgba(124,109,240,0.3);
    --teal: #2dd4bf;
    --teal-dim: rgba(45,212,191,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --red: #f87171;
    --green: #4ade80;
    --text: #e8e6f0;
    --text-muted: #7b7890;
    --text-dim: #4a4860;
    --mono: 'DM Mono', monospace;
    --serif: 'Instrument Serif', serif;
    --radius: 8px;
    --radius-lg: 14px;
  }

  html { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.6; }

  body { min-height: 100vh; display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 56px 1fr; }

  /* ── header ── */
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo {
    font-family: var(--serif);
    font-style: italic;
    font-size: 19px;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--accent); }
  .header-tag {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 3px 8px;
    border: 1px solid var(--border-bright);
    border-radius: 4px;
  }
  .header-status {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.error { background: var(--red); }

  /* ── sidebar ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; color: var(--text-muted); }
  .field input, .field select {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggle-btn {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
  .toggle-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  .slider-field { display: flex; flex-direction: column; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type=range] {
    flex: 1; height: 3px;
    -webkit-appearance: none; appearance: none;
    background: var(--surface3);
    border-radius: 2px;
    outline: none;
    border: none;
    padding: 0;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .slider-val {
    font-size: 12px;
    color: var(--accent);
    min-width: 48px;
    text-align: right;
  }

  .run-btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: opacity 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .run-btn:hover:not(:disabled) { opacity: 0.9; }
  .run-btn:active:not(:disabled) { transform: scale(0.98); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .quick-btn {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-btn:hover { border-color: var(--teal); color: var(--teal); }

  /* ── main ── */
  main {
    background: var(--bg);
    overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* ── empty state ── */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text-dim);
    text-align: center;
    padding: 60px 0;
  }
  .empty-glyph {
    font-family: var(--serif);
    font-style: italic;
    font-size: 72px;
    line-height: 1;
    color: var(--surface3);
  }
  .empty-state p { font-size: 12px; max-width: 260px; line-height: 1.8; }

  /* ── loading ── */
  .loading-bar {
    height: 2px; width: 100%;
    background: var(--surface3);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .loading-bar.active { display: block; }
  .loading-bar::after {
    content: '';
    display: block; height: 100%;
    width: 40%; background: var(--accent);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ── result cards ── */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }

  .decoder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
  .decoder-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
  }
  .decoder-card.bposd::before { background: var(--accent); }
  .decoder-card.bp::before { background: var(--teal); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dc-name {
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 14px;
  }
  .dc-metric { margin-bottom: 12px; }
  .dc-metric-label { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; }
  .dc-metric-value { font-size: 20px; font-weight: 300; color: var(--text); letter-spacing: -0.02em; }
  .dc-metric-value.accent { color: var(--accent); }
  .dc-metric-value.teal { color: var(--teal); }
  .dc-metric-value.amber { color: var(--amber); }
  .dc-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* ── code info bar ── */
  .code-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex; gap: 24px; flex-wrap: wrap;
    align-items: center;
  }
  .code-param { display: flex; flex-direction: column; gap: 2px; }
  .code-param-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .code-param-value { font-size: 13px; color: var(--text); }
  .code-tag {
    margin-left: auto;
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--text-muted);
  }

  /* ── chart panel ── */
  .chart-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .chart-title {
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; height: 200px; }

  /* ── log panel ── */
  .log-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .log-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .log-dot { width: 6px; height: 6px; border-radius: 50%; }
  .log-body {
    padding: 14px 16px;
    font-size: 11px; line-height: 1.9;
    color: var(--text-muted);
    max-height: 180px;
    overflow-y: auto;
  }
  .log-line.ok { color: var(--green); }
  .log-line.err { color: var(--red); }
  .log-line.info { color: var(--text-muted); }
  .log-line.key { color: var(--accent); }

  /* ── error banner ── */
  .error-banner {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 12px;
    color: var(--red);
    display: none;
  }
  .error-banner.show { display: block; }

  /* ── compare section ── */
  .compare-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }
  .mini-stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .mini-label { font-size: 10px; color: var(--text-dim); }
  .mini-val { font-size: 13px; color: var(--text); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">BB<span>sim</span></div>
  <div class="header-tag">circuit-level · ldpc</div>
  <div class="header-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">idle</span>
  </div>
</header>

<!-- SIDEBAR -->
<aside>

  <div>
    <div class="section-label">Code construction</div>
    <div class="field-row">
      <div class="field"><label>ℓ</label><input type="number" id="ell" value="6" min="2" max="40"></div>
      <div class="field"><label>m</label><input type="number" id="m_val" value="6" min="2" max="40"></div>
    </div>
    <div style="height:10px"></div>
    <div class="field"><label>a₁ exponents</label><input type="text" id="a1" value="3" placeholder="e.g. 3"></div>
    <div style="height:8px"></div>
    <div class="field"><label>a₂₃ exponents</label><input type="text" id="a23" value="1,2" placeholder="e.g. 1,2"></div>
    <div style="height:8px"></div>
    <div class="field"><label>b₁₂ exponents</label><input type="text" id="b12" value="1,2" placeholder="e.g. 1,2"></div>
    <div style="height:8px"></div>
    <div class="field"><label>b₃ exponents</label><input type="text" id="b3" value="3" placeholder="e.g. 3"></div>
  </div>

  <div>
    <div class="section-label">Simulation</div>
    <div class="slider-field">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="font-size:11px;color:var(--text-muted)">Error rate p</label>
        <span class="slider-val" id="pVal">0.010</span>
      </div>
      <div class="slider-row">
        <input type="range" id="pSlider" min="0.001" max="0.1" step="0.001" value="0.01">
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="slider-field">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="font-size:11px;color:var(--text-muted)">Trials</label>
        <span class="slider-val" id="trialsVal">10000</span>
      </div>
      <div class="slider-row">
        <input type="range" id="trialsSlider" min="100" max="100000" step="100" value="10000">
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="slider-field">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="font-size:11px;color:var(--text-muted)">Rounds</label>
        <span class="slider-val" id="roundsVal">12</span>
      </div>
      <div class="slider-row">
        <input type="range" id="roundsSlider" min="1" max="40" step="1" value="12">
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="field-row">
      <div class="field">
        <label>W (window)</label>
        <input type="number" id="W" value="1" min="1" max="10">
      </div>
      <div class="field">
        <label>F (stride)</label>
        <input type="number" id="F" value="1" min="1" max="10">
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="field">
      <label>Basis</label>
      <div class="toggle-group" style="margin-top:2px">
        <div class="toggle-btn active" data-basis="false" id="basisX" onclick="setBasis(false)">X basis</div>
        <div class="toggle-btn" data-basis="true" id="basisZ" onclick="setBasis(true)">Z basis</div>
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="field">
      <label>Method</label>
      <div class="toggle-group" style="margin-top:2px">
        <div class="toggle-btn active" onclick="setMethod(0,this)">0</div>
        <div class="toggle-btn" onclick="setMethod(1,this)">1</div>
        <div class="toggle-btn" onclick="setMethod(2,this)">2</div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Decoders</div>
    <div class="toggle-group">
      <div class="toggle-btn active" id="dec-BPOSD" onclick="toggleDecoder('BPOSD',this)">BPOSD</div>
      <div class="toggle-btn active" id="dec-BP" onclick="toggleDecoder('BP',this)">BP</div>
    </div>
  </div>

  <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
    <button class="quick-btn" onclick="runQuick()">⚡ quick run (100 trials)</button>
    <button class="run-btn" id="runBtn" onclick="runSim()">run simulation</button>
  </div>

</aside>

<!-- MAIN -->
<main id="main">
  <div class="empty-state" id="emptyState">
    <div class="empty-glyph">[[n,k,d]]</div>
    <p>configure a bivariate bicycle code and run a circuit-level simulation</p>
    <p style="color:var(--text-dim); font-size:11px; margin-top:4px">connects to <code style="color:var(--accent)">localhost:8000</code></p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const API = 'http://localhost:8000';
let zBasis = false;
let method = 0;
let activeDecoders = new Set(['BPOSD', 'BP']);
let history = [];
let chartInst = null;

// sliders
const pSlider = document.getElementById('pSlider');
const trialsSlider = document.getElementById('trialsSlider');
const roundsSlider = document.getElementById('roundsSlider');
pSlider.oninput = () => { document.getElementById('pVal').textContent = parseFloat(pSlider.value).toFixed(3); };
trialsSlider.oninput = () => { document.getElementById('trialsVal').textContent = parseInt(trialsSlider.value).toLocaleString(); };
roundsSlider.oninput = () => { document.getElementById('roundsVal').textContent = roundsSlider.value; };

function setBasis(val) {
  zBasis = val;
  document.getElementById('basisX').classList.toggle('active', !val);
  document.getElementById('basisZ').classList.toggle('active', val);
}

function setMethod(val, el) {
  method = val;
  document.querySelectorAll('.toggle-btn[onclick^="setMethod"]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function toggleDecoder(name, el) {
  if (activeDecoders.has(name)) {
    if (activeDecoders.size === 1) return;
    activeDecoders.delete(name);
    el.classList.remove('active');
  } else {
    activeDecoders.add(name);
    el.classList.add('active');
  }
}

function parseList(str) {
  return str.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
}

function buildPayload(trialOverride) {
  return {
    code: {
      ell: parseInt(document.getElementById('ell').value),
      m: parseInt(document.getElementById('m_val').value),
      a1: parseList(document.getElementById('a1').value),
      a23: parseList(document.getElementById('a23').value),
      b12: parseList(document.getElementById('b12').value),
      b3: parseList(document.getElementById('b3').value),
    },
    error_rate: parseFloat(pSlider.value),
    num_trials: trialOverride ?? parseInt(trialsSlider.value),
    num_repeat: parseInt(roundsSlider.value),
    W: parseInt(document.getElementById('W').value),
    F: parseInt(document.getElementById('F').value),
    z_basis: zBasis,
    method: method,
    decoders: [...activeDecoders],
  };
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  dot.className = 'status-dot ' + (state === 'running' ? 'live' : state === 'error' ? 'error' : '');
  label.textContent = text;
}

function runQuick() { runSim(100); }

async function runSim(trialOverride) {
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  setStatus('running', 'running…');

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="loading-bar active" id="loadBar"></div>
    <div class="log-panel" id="logPanel">
      <div class="log-header">
        <div class="log-dot" style="background:var(--accent)"></div>
        <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim)">simulation log</span>
      </div>
      <div class="log-body" id="logBody"></div>
    </div>
    <div class="error-banner" id="errBanner"></div>
  `;

  const log = (msg, cls='info') => {
    const lb = document.getElementById('logBody');
    if (!lb) return;
    const line = document.createElement('div');
    line.className = 'log-line ' + cls;
    line.textContent = '› ' + msg;
    lb.appendChild(line);
    lb.scrollTop = lb.scrollHeight;
  };

  const payload = buildPayload(trialOverride);
  log(`POST ${API}/simulate`);
  log(`code: [[ℓ=${payload.code.ell}, m=${payload.code.m}]]`);
  log(`p=${payload.error_rate}  trials=${payload.num_trials}  rounds=${payload.num_repeat}`);
  log(`decoders: ${payload.decoders.join(', ')}`);
  log('waiting for response…');

  const t0 = performance.now();
  let data;
  try {
    const res = await fetch(`${API}/simulate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.detail ?? `HTTP ${res.status}`);
  } catch (e) {
    setStatus('error', 'error');
    btn.disabled = false;
    log('request failed: ' + e.message, 'err');
    const eb = document.getElementById('errBanner');
    if (eb) { eb.textContent = e.message; eb.classList.add('show'); }
    return;
  }

  const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
  log(`completed in ${elapsed}s`, 'ok');
  for (const [dec, res] of Object.entries(data.results)) {
    log(`${dec}: p_L=${res.logical_error_rate.toFixed(4)}  p_L/round=${res.logical_error_rate_per_round.toFixed(6)}`, 'key');
  }

  history.push({ payload, data, ts: new Date() });
  renderResults(data);
  setStatus('', `done · ${elapsed}s`);
  btn.disabled = false;
}

function renderResults(data) {
  const main = document.getElementById('main');
  const decNames = Object.keys(data.results);

  const cardsHtml = decNames.map((name, i) => {
    const r = data.results[name];
    const cls = name.toLowerCase().replace('-','');
    const color = name === 'BPOSD' ? 'accent' : 'teal';
    return `
      <div class="decoder-card ${cls}" style="animation-delay:${i*0.08}s">
        <div class="dc-name">${name}</div>
        <div class="dc-metric">
          <div class="dc-metric-label">logical error rate</div>
          <div class="dc-metric-value ${color}">${r.logical_error_rate.toFixed(4)}</div>
        </div>
        <div class="dc-metric">
          <div class="dc-metric-label">p_L per round</div>
          <div class="dc-metric-value" style="font-size:15px">${r.logical_error_rate_per_round.toExponential(3)}</div>
        </div>
        <div class="dc-metric">
          <div class="dc-metric-label">avg decode time</div>
          <div class="dc-metric-value amber" style="font-size:15px">${(r.avg_decoding_time_seconds * 1000).toFixed(3)} ms</div>
        </div>
      </div>`;
  }).join('');

  const compareHtml = decNames.length > 1 ? `
    <div style="margin-bottom:8px"><span class="section-label">decoder comparison</span></div>
    <div class="compare-row">
      ${decNames.map(n => `
        <div class="mini-stat">
          <div class="mini-label">${n} · p_L ratio</div>
          <div class="mini-val">${(data.results[n].logical_error_rate / Math.min(...decNames.map(d=>data.results[d].logical_error_rate))).toFixed(3)}×</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">${n} · speed</div>
          <div class="mini-val">${(1/data.results[n].avg_decoding_time_seconds).toFixed(0)} dec/s</div>
        </div>
      `).join('')}
    </div>` : '';

  const historyHtml = history.length > 1 ? renderHistoryChart() : '';

  main.innerHTML = `
    <div class="code-info">
      <div class="code-param"><div class="code-param-label">code</div><div class="code-param-value">${data.code_name}</div></div>
      <div class="code-param"><div class="code-param-label">n</div><div class="code-param-value">${data.code_n}</div></div>
      <div class="code-param"><div class="code-param-label">k</div><div class="code-param-value">${data.code_k}</div></div>
      <div class="code-param"><div class="code-param-label">p</div><div class="code-param-value">${data.error_rate}</div></div>
      <div class="code-param"><div class="code-param-label">trials</div><div class="code-param-value">${data.num_trials.toLocaleString()}</div></div>
      <div class="code-param"><div class="code-param-label">rounds</div><div class="code-param-value">${data.num_repeat}</div></div>
      <div class="code-tag">[[${data.code_n}, ${data.code_k}]]</div>
    </div>

    <div class="results-grid">${cardsHtml}</div>

    ${compareHtml}

    <div class="chart-panel">
      <div class="chart-title">logical error rate — decoders</div>
      <div class="legend-row" id="chartLegend" style="display:flex;gap:16px;margin-bottom:12px;font-size:11px;color:var(--text-muted)"></div>
      <div class="chart-wrap"><canvas id="resultsChart" role="img" aria-label="Bar chart of logical error rates per decoder"></canvas></div>
    </div>

    ${historyHtml}

    <div class="log-panel">
      <div class="log-header">
        <div class="log-dot" style="background:var(--green)"></div>
        <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim)">result log</span>
      </div>
      <div class="log-body">
        ${decNames.map(n => {
          const r = data.results[n];
          return `<div class="log-line key">› ${n}: p_L=${r.logical_error_rate.toFixed(6)}  p_L/round=${r.logical_error_rate_per_round.toExponential(4)}  t=${(r.avg_decoding_time_seconds*1000).toFixed(4)}ms</div>`;
        }).join('')}
        <div class="log-line info">› wall time: ${data.wall_time_seconds.toFixed(2)}s</div>
      </div>
    </div>
  `;

  // chart
  const colors = { BPOSD: '#7c6df0', BP: '#2dd4bf', 'BPOSD-0': '#f59e0b' };
  const legend = document.getElementById('chartLegend');
  decNames.forEach(n => {
    const col = colors[n] ?? '#888';
    legend.innerHTML += `<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:${col};display:inline-block"></span>${n}</span>`;
  });

  if (chartInst) { chartInst.destroy(); chartInst = null; }
  chartInst = new Chart(document.getElementById('resultsChart'), {
    type: 'bar',
    data: {
      labels: decNames,
      datasets: [{
        data: decNames.map(n => data.results[n].logical_error_rate),
        backgroundColor: decNames.map(n => (colors[n] ?? '#888') + '33'),
        borderColor: decNames.map(n => colors[n] ?? '#888'),
        borderWidth: 1.5,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` p_L = ${ctx.raw.toFixed(6)}` }
      }},
      scales: {
        x: { ticks: { color: '#7b7890', font: { family: 'DM Mono', size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { ticks: { color: '#7b7890', font: { family: 'DM Mono', size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });
}

function renderHistoryChart() {
  return `
    <div class="chart-panel">
      <div class="chart-title">p_L over successive runs</div>
      <div class="chart-wrap"><canvas id="histChart" role="img" aria-label="Line chart of logical error rate over successive simulation runs"></canvas></div>
    </div>
  `;
}

// ping health on load
(async () => {
  try {
    const r = await fetch(`${API}/health`, { signal: AbortSignal.timeout(2000) });
    if (r.ok) setStatus('live', 'api reachable');
  } catch {
    setStatus('error', 'api unreachable');
  }
})();

// render history chart after DOM updates (history > 1)
const _origRender = renderResults;
</script>
</body>
</html>
